<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Value Guard</title>
    <link rel="stylesheet" href="./popup.css">
</head>
<body>
    <main class="popup">
        <header class="brand">
            <div class="brand-name">
                <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect width="32" height="32" rx="10" fill="currentColor"/>
                    <path d="M10 12h12M10 16h8M10 20h4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span>Low-Value Guard</span>
            </div>
            <span class="platform">For LinkedIn</span>
        </header>

        <section class="intro" aria-labelledby="headline">
            <p class="eyebrow">YOUR FEED, REFINED</p>
            <h1 id="headline">A little less noise.</h1>
            <p class="intro-copy">Make room for posts worth your attention.</p>
        </section>

        <fieldset id="controls" class="controls" disabled>
            <legend class="sr-only">Feed filtering settings</legend>

            <div class="power-row">
                <div>
                    <label class="control-title" for="toggle-switch">Feed filtering</label>
                    <p class="status" id="filter-status" role="status">Loading settings…</p>
                </div>
                <label class="switch">
                    <input id="toggle-switch" type="checkbox" role="switch" aria-describedby="filter-status">
                    <span class="switch-track" aria-hidden="true"></span>
                </label>
            </div>

            <div class="mode-section">
                <p class="section-label" id="mode-label">WHEN A POST IS FILTERED</p>
                <div class="mode-options" role="radiogroup" aria-labelledby="mode-label" aria-describedby="mode-description">
                    <label class="mode-card">
                        <input type="radio" name="filter-mode" value="blur" checked>
                        <span class="mode-surface">
                            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M4 8h16M4 12h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 4"/>
                            </svg>
                            <span class="mode-title">Blur</span>
                            <span class="mode-caption">Reveal when you want</span>
                            <span class="selection-dot" aria-hidden="true"></span>
                        </span>
                    </label>
                    <label class="mode-card">
                        <input type="radio" name="filter-mode" value="remove">
                        <span class="mode-surface">
                            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <rect x="4" y="5" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
                                <path d="M9 12h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                            </svg>
                            <span class="mode-title">Hide</span>
                            <span class="mode-caption">Keep it out of view</span>
                            <span class="selection-dot" aria-hidden="true"></span>
                        </span>
                    </label>
                </div>
                <p class="mode-description" id="mode-description">Select “Show post” to reveal a blurred post.</p>
            </div>
        </fieldset>

        <p id="popup-error" class="error-message" role="alert" hidden></p>

        <footer class="footer">
            <span>A calmer scroll starts here.</span>
            <button class="settings-button" id="settings-button" type="button">
                Settings <span aria-hidden="true">↗</span>
            </button>
        </footer>
    </main>
    <script src="../lib/settings.js"></script>
    <script src="./popup.js"></script>
</body>
</html>
