<main>
    <h1>Low-Value Guard</h1>
    <p role="status">{{ status() }}</p>
    <fieldset [disabled]="pending()">
        <label><input type="checkbox" [checked]="enabled()" (change)="changeEnabled($event)" /> Filter feed posts</label>
        <label>Filter mode
            <select [value]="mode()" (change)="changeMode($event)">
                <option value="blur">Blur</option>
                <option value="remove">Hide</option>
            </select>
        </label>
    </fieldset>
    <section aria-label="Your account">
        @if (user(); as signedIn) {
            <p>Signed in as {{ signedIn.email }}</p>
            <button type="button" (click)="signOut()">Sign out</button>
        } @else {
            <form (submit)="authenticate($event, email, password)">
                <label>Email <input #email type="email" autocomplete="username" required /></label>
                <label>Password <input #password type="password" autocomplete="current-password" required /></label>
                <button type="submit" value="sign-in" [disabled]="authPending()">Sign in</button>
                <button type="submit" value="sign-up" [disabled]="authPending()">Create account</button>
            </form>
        }
    </section>
    <button type="button" [disabled]="!user() || pending()" (click)="countFeedback()">Count saved feedback</button>
    <p role="alert" [hidden]="!error()">{{ error() }}</p>
</main>
